name: Test-Push senden

on:
  workflow_dispatch:

jobs:
  send-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Test-Push über OneSignal senden
        env:
          ONESIGNAL_APP_ID: 264f05a0-58fc-4611-9f11-189078fac630
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}

        run: |
          response=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --url https://api.onesignal.com/notifications \
            --header "Authorization: Key $ONESIGNAL_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{
              "app_id":"'"$ONESIGNAL_APP_ID"'",
              "target_channel":"push",
              "included_segments":["Total Subscriptions"],
              "headings":{
                "de":"🧪 Test-Push"
              },
              "contents":{
                "de":"Wenn du das liest, funktioniert GitHub → OneSignal 🎉"
              },
              "url":"https://bwbk-schuelerzeitung.github.io"
            }')

          echo "OneSignal-Antwort:"
          echo "$response"