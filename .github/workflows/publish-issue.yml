name: Neue Ausgabe veröffentlichen

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Titel der Ausgabe"
        required: true
        type: string

      published_at:
        description: "Datum im Format JJJJ-MM-TT"
        required: true
        type: string

      description:
        description: "Kurze Beschreibung der Ausgabe"
        required: true
        type: string

      pdf_filename:
        description: "PDF-Dateiname, z. B. ausgabe2.pdf"
        required: true
        type: string

      cover_filename:
        description: "Cover-Dateiname, z. B. cover2.jpg"
        required: true
        type: string

permissions:
  contents: write
  pages: write

jobs:
  publish-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Ausgabe prüfen und eintragen
        env:
          TITLE: ${{ inputs.title }}
          PUBLISHED_AT: ${{ inputs.published_at }}
          DESCRIPTION: ${{ inputs.description }}
          PDF_FILENAME: ${{ inputs.pdf_filename }}
          COVER_FILENAME: ${{ inputs.cover_filename }}
        run: |
          python3 <<'PYTHON'
          import json
          import os
          import re
          import sys
          from datetime import date
          from pathlib import Path

          data_file = Path("data/ausgaben.json")

          title = os.environ["TITLE"].strip()
          description = os.environ["DESCRIPTION"].strip()
          published_at = os.environ["PUBLISHED_AT"].strip()
          pdf_filename = os.environ["PDF_FILENAME"].strip()
          cover_filename = os.environ["COVER_FILENAME"].strip()

          if not title:
              sys.exit("Der Titel darf nicht leer sein.")

          if not description:
              sys.exit("Die Beschreibung darf nicht leer sein.")

          try:
              date.fromisoformat(published_at)
          except ValueError:
              sys.exit("Das Datum muss im Format JJJJ-MM-TT angegeben werden.")

          if Path(pdf_filename).name != pdf_filename:
              sys.exit("Beim PDF-Dateinamen darf kein Ordnerpfad stehen.")

          if Path(cover_filename).name != cover_filename:
              sys.exit("Beim Cover-Dateinamen darf kein Ordnerpfad stehen.")

          if not pdf_filename.lower().endswith(".pdf"):
              sys.exit("Die Ausgabedatei muss auf .pdf enden.")

          if not re.search(
              r"\.(png|jpg|jpeg|webp)$",
              cover_filename,
              re.IGNORECASE
          ):
              sys.exit("Das Cover muss PNG, JPG, JPEG oder WebP sein.")

          pdf_path = Path("assets/pdf") / pdf_filename
          cover_path = Path("assets/covers") / cover_filename

          if not pdf_path.is_file():
              sys.exit(f"PDF nicht gefunden: {pdf_path}")

          if not cover_path.is_file():
              sys.exit(f"Cover nicht gefunden: {cover_path}")

          if not data_file.is_file():
              sys.exit(f"JSON-Datei nicht gefunden: {data_file}")

          with data_file.open("r", encoding="utf-8") as file:
              issues = json.load(file)

          if not isinstance(issues, list):
              sys.exit("data/ausgaben.json muss eine JSON-Liste enthalten.")

          pdf_url = pdf_path.as_posix()
          cover_url = cover_path.as_posix()

          if any(issue.get("pdf") == pdf_url for issue in issues):
              sys.exit("Diese PDF wurde bereits veröffentlicht.")

          numbers = []

          for issue in issues:
              try:
                  numbers.append(int(issue.get("number", 0)))
              except (TypeError, ValueError):
                  pass

          next_number = max(numbers, default=0) + 1

          new_issue = {
              "number": next_number,
              "title": title,
              "publishedAt": published_at,
              "cover": cover_url,
              "pdf": pdf_url,
              "description": description
          }

          issues.append(new_issue)

          issues.sort(
              key=lambda issue: issue.get("publishedAt", ""),
              reverse=True
          )

          with data_file.open("w", encoding="utf-8") as file:
              json.dump(
                  issues,
                  file,
                  ensure_ascii=False,
                  indent=2
              )
              file.write("\n")

          print(f"Ausgabe {next_number} wurde eingetragen.")
          print(f"PDF: {pdf_url}")
          print(f"Cover: {cover_url}")
          PYTHON

      - name: Änderung speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ausgaben.json

          if git diff --cached --quiet; then
            echo "Keine Änderung vorhanden."
            exit 0
          fi

          git commit -m "Publish new newspaper issue"
          git push

      - name: GitHub Pages neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/pages/builds"