name: Neue Ausgabe veröffentlichen

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Titel der Ausgabe"
        required: true
        type: string

      published_at:
        description: "Datum im Format JJJJ-MM-TT"
        required: true
        type: string

      description:
        description: "Kurze Beschreibung der Ausgabe"
        required: true
        type: string

permissions:
  contents: write
  pages: write

jobs:
  publish-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Neue PDF und neues Cover finden
        env:
          TITLE: ${{ inputs.title }}
          PUBLISHED_AT: ${{ inputs.published_at }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          python3 <<'PYTHON'
          import json
          import os
          import subprocess
          import sys

          from datetime import date
          from pathlib import Path


          DATA_FILE = Path("data/ausgaben.json")
          PDF_DIRECTORY = Path("assets/pdf")
          COVER_DIRECTORY = Path("assets/covers")

          title = os.environ["TITLE"].strip()
          description = os.environ["DESCRIPTION"].strip()
          published_at = os.environ["PUBLISHED_AT"].strip()


          def mime_type(path):
              result = subprocess.run(
                  [
                      "file",
                      "--brief",
                      "--mime-type",
                      str(path)
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )

              return result.stdout.strip().lower()


          if not title:
              sys.exit("Der Titel darf nicht leer sein.")

          if not description:
              sys.exit("Die Beschreibung darf nicht leer sein.")

          try:
              date.fromisoformat(published_at)
          except ValueError:
              sys.exit(
                  "Das Datum muss im Format JJJJ-MM-TT angegeben werden."
              )


          if not DATA_FILE.is_file():
              sys.exit(
                  f"JSON-Datei nicht gefunden: {DATA_FILE}"
              )

          if not PDF_DIRECTORY.is_dir():
              sys.exit(
                  f"PDF-Ordner nicht gefunden: {PDF_DIRECTORY}"
              )

          if not COVER_DIRECTORY.is_dir():
              sys.exit(
                  f"Cover-Ordner nicht gefunden: {COVER_DIRECTORY}"
              )


          with DATA_FILE.open("r", encoding="utf-8") as file:
              issues = json.load(file)


          if not isinstance(issues, list):
              sys.exit(
                  "data/ausgaben.json muss eine JSON-Liste enthalten."
              )


          used_pdfs = {
              issue.get("pdf", "").lower()
              for issue in issues
          }

          used_covers = {
              issue.get("cover", "").lower()
              for issue in issues
          }


          available_pdfs = []

          for path in PDF_DIRECTORY.iterdir():
              if not path.is_file():
                  continue

              if path.as_posix().lower() in used_pdfs:
                  continue

              if mime_type(path) == "application/pdf":
                  available_pdfs.append(path)


          available_covers = []

          for path in COVER_DIRECTORY.iterdir():
              if not path.is_file():
                  continue

              if path.as_posix().lower() in used_covers:
                  continue

              if mime_type(path).startswith("image/"):
                  available_covers.append(path)


          if len(available_pdfs) == 0:
              sys.exit(
                  "Keine neue, unveröffentlichte PDF gefunden."
              )

          if len(available_pdfs) > 1:
              names = "\n".join(
                  f"- {path.name}"
                  for path in available_pdfs
              )

              sys.exit(
                  "Mehrere unveröffentlichte PDFs gefunden.\n"
                  "Bitte nicht benötigte Dateien entfernen:\n"
                  f"{names}"
              )


          if len(available_covers) == 0:
              sys.exit(
                  "Kein neues, gültiges Coverbild gefunden."
              )

          if len(available_covers) > 1:
              names = "\n".join(
                  f"- {path.name}"
                  for path in available_covers
              )

              sys.exit(
                  "Mehrere unbenutzte Coverbilder gefunden.\n"
                  "Bitte nicht benötigte Dateien entfernen:\n"
                  f"{names}"
              )


          pdf_path = available_pdfs[0]
          cover_path = available_covers[0]


          numbers = []

          for issue in issues:
              try:
                  numbers.append(
                      int(issue.get("number", 0))
                  )
              except (TypeError, ValueError):
                  pass


          next_number = max(numbers, default=0) + 1


          new_issue = {
              "number": next_number,
              "title": title,
              "publishedAt": published_at,
              "cover": cover_path.as_posix(),
              "pdf": pdf_path.as_posix(),
              "description": description
          }


          issues.append(new_issue)

          issues.sort(
              key=lambda issue: issue.get(
                  "publishedAt",
                  ""
              ),
              reverse=True
          )


          with DATA_FILE.open("w", encoding="utf-8") as file:
              json.dump(
                  issues,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

              file.write("\n")


          print(f"Ausgabe {next_number} wurde eingetragen.")
          print(f"PDF: {pdf_path.as_posix()}")
          print(f"Cover: {cover_path.as_posix()}")
          PYTHON

      - name: Änderung speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ausgaben.json

          if git diff --cached --quiet; then
            echo "Keine Änderung vorhanden."
            exit 0
          fi

          git commit -m "Publish new newspaper issue"
          git push

      - name: GitHub Pages neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/pages/builds"


      - name: Push-Benachrichtigung senden
        env:
         ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}

  run: |
    response=$(curl --silent --show-error \
      --request POST \
      --url "https://api.onesignal.com/notifications" \
      --header "Authorization: Key ${ONESIGNAL_API_KEY}" \
      --header "Content-Type: application/json" \
      --data '{
        "app_id": "264f05a0-58fc-4611-9f11-189078fac630",
        "target_channel": "push",
        "included_segments": [
          "Alle Push-Abonnenten"
        ],
        "headings": {
          "de": "BWBK Aktuell"
        },
        "contents": {
          "de": "Eine neue Ausgabe ist erschienen. Jetzt lesen."
        },
        "url": "https://bwbk-schuelerzeitung.github.io"
      }')

    echo "$response"

    if ! echo "$response" | grep -q '"id":"[^"]'; then
      echo "Push konnte nicht versendet werden."
      exit 1
    fi