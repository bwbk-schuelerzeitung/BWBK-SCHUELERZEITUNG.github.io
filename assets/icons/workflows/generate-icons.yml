name: Generate app icons

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/icons/icon-1024.png"

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: ImageMagick installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Icons erzeugen
        run: |
          magick assets/icons/icon-1024.png \
            -resize 512x512 \
            assets/icons/icon-512.png

          magick assets/icons/icon-1024.png \
            -resize 192x192 \
            assets/icons/icon-192.png

          magick assets/icons/icon-1024.png \
            -resize 64x64 \
            assets/icons/favicon.png

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/icons/icon-512.png
          git add assets/icons/icon-192.png
          git add assets/icons/favicon.png

          git diff --cached --quiet && exit 0

          git commit -m "Generate app icon sizes"
          
          git push